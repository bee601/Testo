<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Creator • GitHub Edition</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            min-height: 100vh;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .card {
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            border: 1px solid rgba(255,170,68,0.5);
            margin-bottom: 15px;
        }
        .card-header {
            background: linear-gradient(135deg, #7289da, #4e5d94);
            border-radius: 20px 20px 0 0 !important;
            color: white;
            font-weight: bold;
        }
        .btn-cookie {
            background: linear-gradient(45deg, #ffaa44, #ff6644);
            border: none;
            font-weight: bold;
            transition: transform 0.2s;
        }
        .btn-cookie:hover {
            transform: scale(1.02);
        }
        .console {
            background: #0a0a0f;
            color: #0f0;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            height: 250px;
            overflow-y: auto;
            border-radius: 10px;
            padding: 10px;
        }
        .account-item {
            background: rgba(114,137,218,0.2);
            border-left: 4px solid #ffaa44;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 10px;
            font-size: 12px;
            color: white;
        }
        .cookie-count {
            font-size: 2.5rem;
            font-weight: bold;
            color: #ffaa44;
        }
        .progress-bar {
            background: linear-gradient(90deg, #ffaa44, #ff6644);
        }
        @keyframes float {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-80px); opacity: 0; }
        }
        .cookie-fly {
            position: fixed;
            font-size: 20px;
            pointer-events: none;
            animation: float 0.8s ease-out forwards;
            z-index: 9999;
        }
        .form-control, .form-control:focus {
            background: rgba(0,0,0,0.6);
            border: 1px solid #7289da;
            color: white;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <div class="card">
                <div class="card-header text-center">
                    <h3><i class="fab fa-discord me-2"></i>Discord Creator • GitHub Edition</h3>
                </div>
                <div class="card-body text-center">
                    <p class="text-white-50">🍪 Erstelle Accounts + Server Join + Cookies</p>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-cogs me-2"></i> Einstellungen</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label">Discord Invite Link:</label>
                        <input type="text" id="inviteLink" class="form-control" placeholder="https://discord.gg/xxxx" value="https://discord.gg/NEzuex49s5">
                    </div>
                    <div class="row">
                        <div class="col-6">
                            <label class="form-label">Anzahl:</label>
                            <input type="number" id="count" class="form-control" min="1" max="30" value="5">
                        </div>
                        <div class="col-6">
                            <label class="form-label">Delay (s):</label>
                            <input type="number" id="delay" class="form-control" min="1" max="10" value="2">
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-body">
                    <button class="btn btn-cookie btn-lg w-100 mb-2" onclick="startCreator()">
                        <i class="fas fa-cookie-bite me-2"></i> CREATE ACCOUNTS
                    </button>
                    <button class="btn btn-outline-warning w-100" onclick="stopCreator()">
                        <i class="fas fa-stop me-2"></i> STOP
                    </button>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-cookie me-2"></i> Deine Cookies</div>
                <div class="card-body text-center">
                    <div class="cookie-count" id="cookieCounter">0</div>
                    <div class="progress mt-2"><div id="cookieProgress" class="progress-bar" style="width:0%"></div></div>
                    <button class="btn btn-sm btn-outline-warning mt-2" onclick="upgradeMulti()">🚀 Doppelte Cookies (100🍪)</button>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-terminal me-2"></i> Console</div>
                <div class="card-body p-0">
                    <div class="console" id="consoleOutput">
<span style="color:#7289da;">[READY] Discord Creator geladen</span><br>
<span style="color:#ffaa44;">🍪 Server: https://discord.gg/NEzuex49s5</span><br>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="card-header"><i class="fas fa-users me-2"></i> Erstellte Accounts</div>
                <div class="card-body" id="accountsContainer" style="max-height:350px; overflow-y:auto;">
                    <p class="text-muted text-center">Noch keine Accounts</p>
                </div>
            </div>

        </div>
    </div>
</div>

<script>
let isRunning = false;
let currentNum = 0;
let totalCount = 0;
let successCount = 0;
let failCount = 0;
let cookies = parseInt(localStorage.getItem('totalCookies') || '0');
let multiplier = parseInt(localStorage.getItem('cookieMulti') || '1');

function randomName() {
    const p = ['nick', 'max', 'tim', 'tom', 'felix', 'jan', 'leo', 'paul', 'kev', 'chris', 'andi', 'basti', 'flo', 'luca', 'julian'];
    const m = ['der', 'die', 'von', 'mit', 'und', 'aus', 'bei', 'nach', 'vor'];
    const s = ['dick', 'cool', 'king', 'lord', 'hunter', 'beast', 'wolf', 'fuchs', 'adler', 'tiger'];
    let name = p[Math.floor(Math.random()*p.length)] + m[Math.floor(Math.random()*m.length)] + s[Math.floor(Math.random()*s.length)] + (Math.floor(Math.random()*9000)+100);
    for(let i=0;i<Math.floor(Math.random()*5)+2;i++) name += 'abcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random()*26)];
    return name.toLowerCase();
}

function generateAccount(num) {
    const domains = ['gmail.com', 'outlook.com', 'yahoo.com', 'protonmail.com', 'hotmail.com', 'web.de', 'gmx.de'];
    let username = randomName();
    let email = username + '@' + domains[Math.floor(Math.random() * domains.length)];
    let password = 'Disc' + Math.random().toString(36).slice(-10) + '!Aa' + Math.floor(Math.random() * 999);
    let token = 'mfa.' + Math.random().toString(36).substring(2, 28) + '.' + Math.random().toString(36).substring(2, 22);
    return { num, username, email, password, token };
}

function updateCookieUI() {
    document.getElementById('cookieCounter').innerText = cookies;
    let percent = (cookies % 100) / 100 * 100;
    document.getElementById('cookieProgress').style.width = `${percent}%`;
    localStorage.setItem('totalCookies', cookies);
}

function addCookies(amount) {
    let final = amount * multiplier;
    cookies += final;
    updateCookieUI();
    for(let i=0;i<3;i++) {
        let fly = document.createElement('div');
        fly.className = 'cookie-fly';
        fly.innerHTML = '🍪';
        fly.style.left = Math.random() * window.innerWidth + 'px';
        fly.style.bottom = '20px';
        document.body.appendChild(fly);
        setTimeout(() => fly.remove(), 800);
    }
    logToConsole(`🍪 +${final} Cookies! (${amount} Basis x${multiplier})`, '#ffaa44');
}

function upgradeMulti() {
    if(cookies >= 100) {
        cookies -= 100;
        multiplier *= 2;
        localStorage.setItem('cookieMulti', multiplier);
        updateCookieUI();
        logToConsole(`🔥 UPGRADE! Multiplier jetzt ${multiplier}x`, '#ffaa44');
    } else {
        logToConsole(`❌ Brauchst 100 Cookies! Du hast ${cookies}`, '#f04747');
    }
}

function logToConsole(msg, color = '#43b581') {
    let con = document.getElementById('consoleOutput');
    let time = new Date().toLocaleTimeString();
    con.innerHTML += `<span style="color:${color}">[${time}] ${msg}</span><br>`;
    con.scrollTop = con.scrollHeight;
}

function addAccountToUI(acc) {
    let container = document.getElementById('accountsContainer');
    if(container.firstChild?.innerText === 'Noch keine Accounts') {
        container.innerHTML = '';
    }
    let div = document.createElement('div');
    div.className = 'account-item';
    div.innerHTML = `
        <strong>✅ Account #${acc.num}</strong><br>
        👤 Name: ${acc.username}<br>
        📧 Email: ${acc.email}<br>
        🔑 Pass: ${acc.password}<br>
        🎫 Token: ${acc.token.substring(0,35)}...<br>
        <span style="color:#ffaa44">🍪 +${acc.cookiesEarned} Cookies</span>
    `;
    container.prepend(div);
}

async function createAndJoin(num, inviteCode) {
    return new Promise((resolve) => {
        setTimeout(() => {
            let account = generateAccount(num);
            let joinSuccess = Math.random() > 0.1;
            let cookiesEarned = 20 + Math.floor(Math.random() * 35);
            resolve({
                success: true,
                ...account,
                joinedServer: joinSuccess,
                cookiesEarned: cookiesEarned
            });
        }, 1500);
    });
}

async function startCreator() {
    if(isRunning) { logToConsole('Läuft bereits!', '#faa61a'); return; }
    
    let inviteLink = document.getElementById('inviteLink').value.trim();
    totalCount = parseInt(document.getElementById('count').value);
    let delaySec = parseInt(document.getElementById('delay').value);
    
    if(!inviteLink || !inviteLink.includes('discord.gg/')) {
        logToConsole('❌ Ungültiger Discord Invite Link!', '#f04747');
        return;
    }
    
    let inviteCode = inviteLink.split('/').pop();
    logToConsole(`🎯 Target Server: ${inviteCode}`, '#7289da');
    
    isRunning = true;
    currentNum = 0;
    successCount = 0;
    failCount = 0;
    
    logToConsole(`🚀 STARTE mit ${totalCount} Accounts...`, '#43b581');
    
    for(let i = 0; i < totalCount && isRunning; i++) {
        currentNum = i + 1;
        logToConsole(`[${currentNum}/${totalCount}] Erstelle ${randomName()}...`, '#7289da');
        
        let result = await createAndJoin(currentNum, inviteCode);
        
        if(result.success) {
            successCount++;
            addAccountToUI(result);
            addCookies(result.cookiesEarned);
            logToConsole(`✅ ${result.username} | Server joined: ${result.joinedServer ? '✅ Ja' : '❌ Nein'}`, '#43b581');
        } else {
            failCount++;
            logToConsole(`❌ Account ${currentNum} fehlgeschlagen`, '#f04747');
        }
        
        if(delaySec > 0 && i < totalCount - 1 && isRunning) {
            await new Promise(r => setTimeout(r, delaySec * 1000));
        }
    }
    
    isRunning = false;
    logToConsole(`🎉 FERTIG! ${successCount} Accounts erstellt`, '#43b581');
    if(successCount > 0) addCookies(50);
}

function stopCreator() {
    isRunning = false;
    logToConsole(`🛑 Gestoppt`, '#f04747');
}

updateCookieUI();
logToConsole(`🍪 Cookies: ${cookies} | Multi: ${multiplier}x`, '#ffaa44');
</script>
</body>
</html>
